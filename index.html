    <script>
      var data = JSON.parse(document.getElementById("concept-map-data").textContent);
      var SVG_NS = "http://www.w3.org/2000/svg";
      var map = document.getElementById("map");
      var viewport = document.getElementById("viewport");
      var svg = document.getElementById("edges");
      var nodes = document.getElementById("nodes");
      function createSvg(tag, attributes) {
        var element = document.createElementNS(SVG_NS, tag);
        var key;
        attributes = attributes || {};
        for (key in attributes) {
          if (Object.prototype.hasOwnProperty.call(attributes, key)) {
            element.setAttribute(key, String(attributes[key]));
          }
        }
        return element;
      }
      function trimLineBeforeArrow(d, width) {
        var tokens = d.match(/[A-Z]|-?\d+(?:\.\d+)?/g);
        var x, y, previous, index, axis, i, command;
        width = width || 20;
        for (i = 0; i < tokens.length;) {
          command = tokens[i++];
          if (command === "M") { x = Number(tokens[i++]); y = Number(tokens[i++]); continue; }
          previous = { x: x, y: y };
          if (command === "H") { axis = "x"; index = i; x = Number(tokens[i++]); }
          if (command === "V") { axis = "y"; index = i; y = Number(tokens[i++]); }
        }
        if (axis === "x") tokens[index] = String(x - (x >= previous.x ? 1 : -1) * width);
        if (axis === "y") tokens[index] = String(y - (y >= previous.y ? 1 : -1) * width);
        return tokens.join(" ");
      }
      function render() {
        var nodesData = data.nodesData;
        var edgesData = data.edgesData;
        var defs;
        var edgeIndex;
        var pathIndex;
        var nodeIndex;
        map.style.width = nodesData.mapWidth + "px";
        map.style.height = nodesData.mapHeight + "px";
        svg.setAttribute("viewBox", "0 0 " + nodesData.mapWidth + " " + nodesData.mapHeight);
        defs = createSvg("defs");
        function addMarker(id, short) {
          var width = short ? edgesData.style.arrow.shortWidth : edgesData.style.arrow.width;
          var marker = createSvg("marker", { id: id, markerUnits: "userSpaceOnUse", markerWidth: width, markerHeight: edgesData.style.arrow.height, refX: width - 20, refY: edgesData.style.arrow.height / 2, orient: "auto", overflow: "visible" });
          marker.appendChild(createSvg("path", { d: short ? edgesData.style.arrow.shortPath : edgesData.style.arrow.path, fill: edgesData.style.stroke }));
          defs.appendChild(marker);
        }
        addMarker("arrow"); addMarker("arrow-short", true); svg.appendChild(defs);
        for (edgeIndex = 0; edgeIndex < edgesData.edges.length; edgeIndex += 1) {
          var edge = edgesData.edges[edgeIndex];
          for (pathIndex = 0; pathIndex < edge.paths.length; pathIndex += 1) {
            var segment = edge.paths[pathIndex];
            var path = createSvg("path", { "class": "edge", d: segment.markerEnd ? trimLineBeforeArrow(segment.d) : segment.d });
            if (segment.markerEnd) {
              var matches = segment.d.match(/[HV]/g);
              var short = segment.arrowSize === "short" || edge.paths.length > 1 || (matches && matches.length > 1);
            path.setAttribute("marker-end", short ? "url(#arrow-short)" : "url(#arrow)");
            }
            svg.appendChild(path);
          }
        }
        function addAchievementToggle(element, node) {
          var achievement = Number(node.achievement);
          if (
            node.type !== "knowledge-node" ||
            node.achievement === undefined ||
            node.achievement === null ||
            node.achievement === "" ||
            !isFinite(achievement)
          ) {
            return;
          }
          element.style.cursor = "pointer";
          element.addEventListener("click", function () {
            if (element.getAttribute("data-showing-achievement") === "true") {
              element.textContent = node.label;
              element.setAttribute("data-showing-achievement", "false");
            } else {
              element.textContent = achievement.toFixed(1) + "%";
              element.setAttribute("data-showing-achievement", "true");
            }
          });
        }
        for (nodeIndex = 0; nodeIndex < nodesData.nodes.length; nodeIndex += 1) {
          var node = nodesData.nodes[nodeIndex];
          var element = document.createElement("div");
          element.className = "node " + (node.type === "unit-title" ? "unit-title" : "state-" + (node.state || "default"));
          element.style.left = node.x + "px";
          element.style.top = node.y + "px";
          element.style.width = node.width + "px";
          element.style.height = node.height + "px";
          element.textContent = node.label; nodes.appendChild(element);
          addAchievementToggle(element, node);
        }
        function fit() {
          var scale = Math.min(1, viewport.clientWidth / nodesData.mapWidth);
          map.style.transform = "scale(" + scale + ")";
          viewport.style.height = nodesData.mapHeight * scale + "px";
        }
        fit();
        window.addEventListener("resize", fit);
      }
      render();
