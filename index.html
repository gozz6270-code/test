    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f5f5f5; font-family: "Noto Sans KR", Arial, sans-serif; }
      .viewport { width: 100%; overflow: hidden; }
      .map { position: relative; background: #fff; overflow: hidden; transform-origin: top left; margin: 0 auto; }
      .edges, .nodes { position: absolute; inset: 0; width: 100%; height: 100%; }
      .edges { pointer-events: none; z-index: 0; }
      .nodes { z-index: 1; }
      .edge { fill: none; stroke: #b5c3db; stroke-width: 4; stroke-linecap: butt; stroke-linejoin: miter; }
      .node { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px; border: 2px solid #b1b1b1; border-radius: 20px; background: #fdfdfd; color: #a7a7a7; font-size: 30px; font-weight: 500; line-height: 40px; letter-spacing: -1.2px; word-break: break-word; }
      .node.unit-title { align-items: center; justify-content: center; border-color: #ecf2fd; background: #ecf2fd; color: #111; font-size: 34px; letter-spacing: -1.36px; text-align: center; }
      .node-label { display: block; align-self: stretch; height: 62px; flex-shrink: 0; line-height: 40px; text-box-trim: trim-both; text-box-edge: cap alphabetic; }
      .node-achievement { align-self: stretch; flex-shrink: 0; margin-top: 30px; line-height: 40px; text-box-trim: trim-both; text-box-edge: cap alphabetic; }
      .node.state-weak { border-color: #ff9fff; background: #fff4ff; color: #a12ea1; }
      .node.state-good { border-color: #20c6ea; background: #e9fbff; color: #0d6376; }
      .node.state-excellent { border-color: #5de351; background: #f5fff4; color: #1b6714; }
    </style>

    <script>
      var data = JSON.parse(document.getElementById("concept-map-data").textContent);
      var knowledgeProgressById = JSON.parse(document.getElementById("knowledge-progress-by-id").textContent);
      var SVG_NS = "http://www.w3.org/2000/svg";
      var map = document.getElementById("map");
      var viewport = document.getElementById("viewport");
      var svg = document.getElementById("edges");
      var nodes = document.getElementById("nodes");
      function createSvg(tag, attributes) {
        var element = document.createElementNS(SVG_NS, tag);
        var key;
        attributes = attributes || {};
        for (key in attributes) {
          if (Object.prototype.hasOwnProperty.call(attributes, key)) {
            element.setAttribute(key, String(attributes[key]));
          }
        }
        return element;
      }
      function trimLineBeforeArrow(d, width) {
        var tokens = d.match(/[A-Z]|-?\d+(?:\.\d+)?/g);
        var x, y, previous, index, axis, i, command;
        width = width || 20;
        for (i = 0; i < tokens.length;) {
          command = tokens[i++];
          if (command === "M") { x = Number(tokens[i++]); y = Number(tokens[i++]); continue; }
          previous = { x: x, y: y };
          if (command === "H") { axis = "x"; index = i; x = Number(tokens[i++]); }
          if (command === "V") { axis = "y"; index = i; y = Number(tokens[i++]); }
        }
        if (axis === "x") tokens[index] = String(x - (x >= previous.x ? 1 : -1) * width);
        if (axis === "y") tokens[index] = String(y - (y >= previous.y ? 1 : -1) * width);
        return tokens.join(" ");
      }
      function render() {
        var nodesData = data.nodesData;
        var edgesData = data.edgesData;
        var defs;
        var edgeIndex;
        var pathIndex;
        var nodeIndex;
        map.style.width = nodesData.mapWidth + "px";
        map.style.height = nodesData.mapHeight + "px";
        svg.setAttribute("viewBox", "0 0 " + nodesData.mapWidth + " " + nodesData.mapHeight);
        defs = createSvg("defs");
        function addMarker(id, short) {
          var width = short ? edgesData.style.arrow.shortWidth : edgesData.style.arrow.width;
          var marker = createSvg("marker", { id: id, markerUnits: "userSpaceOnUse", markerWidth: width, markerHeight: edgesData.style.arrow.height, refX: width - 20, refY: edgesData.style.arrow.height / 2, orient: "auto", overflow: "visible" });
          marker.appendChild(createSvg("path", { d: short ? edgesData.style.arrow.shortPath : edgesData.style.arrow.path, fill: edgesData.style.stroke }));
          defs.appendChild(marker);
        }
        addMarker("arrow"); addMarker("arrow-short", true); svg.appendChild(defs);
        for (edgeIndex = 0; edgeIndex < edgesData.edges.length; edgeIndex += 1) {
          var edge = edgesData.edges[edgeIndex];
          for (pathIndex = 0; pathIndex < edge.paths.length; pathIndex += 1) {
            var segment = edge.paths[pathIndex];
            var path = createSvg("path", { "class": "edge", d: segment.markerEnd ? trimLineBeforeArrow(segment.d) : segment.d });
            if (segment.markerEnd) {
              var matches = segment.d.match(/[HV]/g);
              var short = segment.arrowSize === "short" || edge.paths.length > 1 || (matches && matches.length > 1);
            path.setAttribute("marker-end", short ? "url(#arrow-short)" : "url(#arrow)");
            }
            svg.appendChild(path);
          }
        }
        function progressFor(node) {
          return knowledgeProgressById[node.id] || {};
        }
        function nodeState(node) {
          var progress = progressFor(node);
          return progress.state || node.state || "default";
        }
        function nodeAchievement(node) {
          var progress = progressFor(node);
          var rawValue = progress.hasOwnProperty("achievement") ? progress.achievement : node.achievement;
          var value = Number(rawValue);
          return isFinite(value) && value > 0 ? value : null;
        }
        function renderNodeContent(element, node) {
          if (node.type === "unit-title") {
            element.textContent = node.label;
            return;
          }
          var label = document.createElement("span");
          label.className = "node-label";
          label.textContent = node.label;
          element.appendChild(label);
          var achievement = nodeAchievement(node);
          var value = document.createElement("span");
          value.className = "node-achievement";
          if (achievement === null) {
            value.style.visibility = "hidden";
            value.setAttribute("aria-hidden", "true");
            value.textContent = "\u00A0";
          } else {
            value.textContent = achievement.toFixed(1) + "%";
          }
          element.appendChild(value);
        }
        for (nodeIndex = 0; nodeIndex < nodesData.nodes.length; nodeIndex += 1) {
          var node = nodesData.nodes[nodeIndex];
          var element = document.createElement("div");
          element.className = "node " + (node.type === "unit-title" ? "unit-title" : "state-" + nodeState(node));
          element.style.left = node.x + "px";
          element.style.top = node.y + "px";
          element.style.width = node.width + "px";
          element.style.height = node.height + "px";
          renderNodeContent(element, node);
          nodes.appendChild(element);
        }
        function fit() {
          var scale = Math.min(1, viewport.clientWidth / nodesData.mapWidth);
          map.style.transform = "scale(" + scale + ")";
          viewport.style.height = nodesData.mapHeight * scale + "px";
        }
        fit();
        window.addEventListener("resize", fit);
      }
      render();
    </script>
